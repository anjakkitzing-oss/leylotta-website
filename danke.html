<script>
document.querySelector('.burger').addEventListener('click',function(){
  var o=document.body.classList.toggle('open');
  this.setAttribute('aria-expanded',o?'true':'false');
});

(function(){
  function part(a,t){
    var n=a.length,best=[0],cut=[0],i,j,s,c;
    for(j=1;j<=n;j++){best[j]=Infinity;cut[j]=0;s=0;
      for(i=j;i>=1;i--){s+=a[i-1];
        if(s>t*2&&j-i>=2)break;
        c=best[i-1]+(s-t)*(s-t);
        if(c<best[j]){best[j]=c;cut[j]=i-1;}}}
    var r=[],k=n;while(k>0){r.unshift([cut[k],k]);k=cut[k];}return r;
  }
  function layout(g){
    var W=g.clientWidth;if(!W)return;
    if(!g._f)g._f=[].slice.call(g.querySelectorAll('.frame'));
    var f=g._f,ar=f.map(function(x){return parseFloat(x.getAttribute('data-ar'))||1;});
    var hDes=W<560?W*0.58:W*0.30;
    hDes=Math.max(150,Math.min(370,hDes));
    var t=Math.max(1.05,W/hDes),key=Math.round(t*12);
    if(g._k===key)return;
    g._k=key;
    var rows=part(ar,t),frag=document.createDocumentFragment();
    rows.forEach(function(r){
      var row=document.createElement('div');row.className='galrow';
      for(var i=r[0];i<r[1];i++){f[i].style.flex=ar[i]+' 1 22px';row.appendChild(f[i]);}
      frag.appendChild(row);
    });
    g.textContent='';g.appendChild(frag);
  }
  function all(reset){[].forEach.call(document.querySelectorAll('.gal'),function(g){
    if(reset)g._k=null;layout(g);});}
  all(false);
  if(window.ResizeObserver){
    var ro=new ResizeObserver(function(e){e.forEach(function(x){layout(x.target);});});
    [].forEach.call(document.querySelectorAll('.gal'),function(g){ro.observe(g);});
  }
  var tm;window.addEventListener('resize',function(){
    clearTimeout(tm);tm=setTimeout(function(){all(true);},140);});
  window.addEventListener('load',function(){all(true);});
})();

</script>
